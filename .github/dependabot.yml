# Grouped so a week's bumps arrive as one PR per ecosystem rather than one per package —
# a stream of single-package PRs is how dependency updates start getting ignored.
version: 2
updates:
  # This is what makes pinning the release action to a SHA sustainable: without it the
  # pin silently goes stale, and "pinned" quietly becomes "never updated".
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  # Production and development split, because they warrant different urgency: a test-only
  # advisory (jsdom's undici, say) ships nothing, while a runtime one reaches spectators.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      production:
        dependency-type: production
      development:
        dependency-type: development

  # The Worker has its own lockfile and would otherwise go unscanned.
  - package-ecosystem: npm
    directory: /worker
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      worker:
        patterns: ['*']
