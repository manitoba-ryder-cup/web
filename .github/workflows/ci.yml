name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      # Every check runs even when an earlier one fails, so one push surfaces
      # everything that needs fixing rather than one problem at a time.
      fail-fast: false
      matrix:
        include:
          - name: Format
            run: npm run format:check
          - name: Lint
            run: npm run lint
          - name: Types
            run: npm run typecheck
          - name: Test
            run: npm run test:run
          - name: Build
            run: npm run build
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ${{ matrix.name }}
        run: ${{ matrix.run }}

  # The Worker is a separate npm project with its own tsconfig, because it compiles
  # against @cloudflare/workers-types rather than the DOM. The root `typecheck` covers
  # worker/src/proxy.ts (the tests import it); this covers the edge wiring in index.ts,
  # which is the half the root project cannot see.
  worker:
    name: Worker types
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: worker

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json
        working-directory: worker
