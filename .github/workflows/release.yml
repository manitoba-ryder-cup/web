name: Release

# Cut a release by pushing a version tag (e.g. `git tag v1.2.0 && git push origin v1.2.0`):
# build the SPA and upload it to Cloudflare Pages, matching how the two services ship.
#
# The checks run here rather than relying on ci.yml, so a tag can never deploy something
# that does not pass them — ci.yml runs on pushes and says nothing about this commit.
on:
  push:
    tags: ['v*']

# write, so the run can publish a GitHub release for the tag it just shipped.
permissions:
  contents: write

jobs:
  release:
    name: Build & deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: |
          npm run format:check
          npm run lint
          npm run typecheck
          npm run test:run

      - name: Build
        run: npm run build

      # Uploads dist/ to the direct-upload Pages project. Unlike the GCP deploys, which
      # federate an OIDC token, Cloudflare has no keyless equivalent — hence a stored
      # token, scoped to Pages:Edit and Workers Scripts:Edit on this account alone.
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=mbrc-web --branch=master

      # The Worker ships on the same tag as the SPA it serves: it exists to make the
      # frontend's relative /api/* calls resolve, so a version of one implies a version of
      # the other. Its PROXY_SECRET is set out of band and is left untouched by a deploy.
      - name: Deploy the API proxy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy

      # A tag deploys but leaves no record of what went out. The notes are generated from
      # the commits since the previous tag; the annotated tag message becomes the summary
      # above them. Nothing is attached — the deployment itself lives in Cloudflare, so
      # there is no artifact here worth keeping.
      - name: Publish the release
        # Pinned to a commit, unlike the actions above it: those are published by GitHub
        # and Cloudflare, while this one is an individual's. A tag is a mutable pointer, so
        # @v3 runs whatever it points at when the job runs — and this step runs after the
        # Cloudflare credential that deploys the site is already in the environment.
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
