# Local development stack for the Manitoba Ryder Cup frontend: brings up the two
# backing services (heimdall auth + scorecard API) and a shared Postgres, built from
# the sibling source repos. The frontend runs on the host (npm dev server) and proxies
# /api/auth -> heimdall and /api/scorecard -> scorecard, so everything is one origin.
#
#   ./dev/generate-keys.sh          # once
#   ./dev/bootstrap.sh              # start the stack + create the dev user
#
# Don't `docker compose up` this by hand the first time — scorecard needs a tenant id
# that doesn't exist until heimdall mints it with the first user, so bootstrap.sh starts
# the services in dependency order and writes .env. See dev/README.md.
#
# Supporting files (postgres init, keys, bootstrap) live under ./dev.
name: mrc-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: mrc-dev-postgres
    environment:
      POSTGRES_USER: superuser
      POSTGRES_PASSWORD: superuser
      POSTGRES_DB: postgres
    ports:
      - "5442:5432" # non-default host port to avoid clashing with the test stacks
    volumes:
      - ./dev/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superuser"]
      interval: 5s
      timeout: 5s
      retries: 10

  heimdall:
    build:
      context: ../../travisbale/heimdall
      dockerfile: Dockerfile
    container_name: mrc-dev-heimdall
    environment:
      DATABASE_URL: postgres://heimdall:heimdall@postgres:5432/heimdall?sslmode=disable
      HTTP_ADDRESS: :8080
      GRPC_ADDRESS: :9090
      JWT_PRIVATE_KEY_PATH: /keys/private-key.pem
      JWT_PUBLIC_KEY_PATH: /keys/public-key.pem
      JWT_ISSUER: heimdall-dev
      REFRESH_TOKEN_EXPIRATION: 24h
      PUBLIC_URL: http://localhost:8080
      ENVIRONMENT: development
      # Dev-only 32-byte hex key for encrypting OIDC/MFA secrets at rest.
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    volumes:
      - ./dev/keys:/keys:ro
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  scorecard:
    build:
      context: ../scorecard
      dockerfile: Dockerfile
    container_name: mrc-dev-scorecard
    environment:
      # Non-superuser role so RLS is enforced; migrations run on startup.
      DATABASE_URL: postgres://scorecard:scorecard_password@postgres:5432/scorecard?sslmode=disable
      HTTP_ADDRESS: :5000
      # Validates heimdall-signed tokens with the shared keypair's public half.
      JWT_PUBLIC_KEY_PATH: /keys/public-key.pem
      ENVIRONMENT: development
      LOG_FORMAT: text
      # Anonymous reads resolve to this tenant — the site reads the dashboard,
      # leaderboard and players without a token, so without it every public page 401s.
      # There is no fixed value: heimdall mints the tenant when the admin user is created,
      # and ./dev/bootstrap.sh writes it here via .env. Unset is fatal rather than
      # defaulted, because a wrong tenant serves an empty site that looks healthy.
      SCORECARD_PUBLIC_TENANT_ID: ${SCORECARD_PUBLIC_TENANT_ID:?run ./dev/bootstrap.sh first}
    volumes:
      - ./dev/keys:/keys:ro
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
